workflows:
  ios-workflow:
    name: iOS Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_ios_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.tonstudio.montrajet.anglais
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.tonstudio.montrajet.anglais"
        APP_VERSION: "1.0.3"   # numéro de version App Store : à augmenter à chaque nouvelle version soumise
      node: latest
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Add iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Generate app icon from assets/icon.png
        script: |
          # Génère toutes les tailles d'icône iOS requises à partir d'une
          # seule image source 1024x1024 (assets/icon.png). Le dossier ios/
          # n'étant pas versionné, cette étape doit tourner à chaque build,
          # juste après sa (re)génération par Capacitor ci-dessus.
          npx --yes --package @capacitor/assets capacitor-assets generate --ios
      - name: Declare export compliance (ITSAppUsesNonExemptEncryption)
        script: |
          # Le dossier ios/ est généré à chaque build : on ajoute la clé ici.
          # L'app n'utilise que du chiffrement standard exempté (HTTPS).
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          plutil -lint "$PLIST"
      - name: Set app version (CFBundleShortVersionString)
        script: |
          # Numéro de version affiché sur l'App Store (variable APP_VERSION).
          # Chaque nouvelle version soumise à Apple doit avoir un numéro
          # supérieur à la précédente : un build "1.0" ne peut pas être
          # rattaché à une version "1.0.1" dans App Store Connect.
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = $APP_VERSION;/g" ios/App/App.xcodeproj/project.pbxproj
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $APP_VERSION" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" ios/App/App/Info.plist
      - name: CarPlay / Bluetooth audio fix (plugin TTS modifié + lecture en arrière-plan)
        script: |
          # Remplace l'implémentation iOS du plugin TTS par notre version
          # (ios-patch/TextToSpeech.swift) : session audio principale activée une
          # seule fois, sans ducking, + piste keep-alive quasi silencieuse en boucle
          # pour que CarPlay/Bluetooth ne coupe jamais le canal entre les mots.
          F=node_modules/@capacitor-community/text-to-speech/ios/Sources/TextToSpeechPlugin/TextToSpeech.swift
          test -f "$F" || { echo "Fichier plugin introuvable: $F"; exit 1; }
          cp ios-patch/TextToSpeech.swift "$F"
          grep -q "keepAlive" "$F" || { echo "PATCH TTS NON APPLIQUE"; exit 1; }
          # Lecture qui continue écran verrouillé (indispensable en voiture).
          PLIST=ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string audio" "$PLIST"
          plutil -lint "$PLIST"
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Increment build number
        script: |
          agvtool new-version -all $(date +%s)
        working_directory: ios/App
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
